name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The icon's colour is how the installed build is told apart from the
      # last one, so a stale PNG is worse than no colour at all: the home
      # screen would say "this is the new one" when it is not. Regenerate
      # from the committed index and refuse the build if anything moved.
      - name: The icon matches its committed colour
        run: node scripts/icon-d.mjs --check

      # A key asked for in a form the catalog does not hold fails silently:
      # no warning, no crash, just the key itself drawn on screen in both
      # languages. Two shipped that way before this step existed.
      - name: Localized keys match the catalog
        run: node scripts/check-strings.mjs

      - name: Show what this runner has
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true

      - name: Select the newest Xcode on the image
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Switching to $LATEST"
            sudo xcode-select -switch "$LATEST"
          else
            echo "No versioned Xcode found; keeping the default toolchain."
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Generate the project
        run: xcodegen generate

      # The image carries several iOS runtimes at once, and a given device name
      # only exists on some of them, so "OS=latest plus a name" does not
      # reliably resolve. Pick the newest iOS runtime, take an iPhone from it,
      # and address it by UDID, which is never ambiguous.
      - name: Pick a simulator
        id: sim
        run: |
          PICK=$(xcrun simctl list devices available --json | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)").v | gsub("-"; ".") | split(".") | map(tonumber)) as $ver
              | .value[]
              | select(.name | test("^iPhone"))
              | { udid: .udid, name: .name, ver: $ver }
            ]
            | sort_by(.ver, .name)
            | last
            | "\(.udid)\t\(.name)\t\(.ver | map(tostring) | join("."))"')
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "No iPhone simulator available on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          UDID=$(printf '%s' "$PICK" | cut -f1)
          echo "Using $(printf '%s' "$PICK" | cut -f2) on iOS $(printf '%s' "$PICK" | cut -f3) ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Raw output is kept alongside the pretty one: xcbeautify drops the
      # argument list from a parameterised test, which is exactly the detail
      # needed when one case of thirteen fails.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Daybook.xcodeproj \
            -scheme Daybook \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee raw-xcodebuild.log | xcbeautify

      - name: Report what failed
        if: failure()
        run: |
          echo "===== compile errors ====="
          grep -E "error:" raw-xcodebuild.log | grep -v "CoreData: error" | sort -u | head -60 || true
          echo
          echo "===== test failures, with arguments ====="
          grep -E "Test [\"']|recorded an issue|Expectation failed|argument" raw-xcodebuild.log \
            | grep -viE "passed after|started\.?$" | head -60 || true

      - name: Keep the raw log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-xcodebuild-log
          path: raw-xcodebuild.log
          retention-days: 7

      # The installable build is made in this same job rather than a second
      # one. macOS runners bill at ten times the rate of Linux, and a separate
      # job pays for a whole second machine plus its Xcode selection and its
      # Homebrew installs before it archives anything. Same output, close to
      # half the cost. Tests run first either way, so a broken build still
      # never produces an installable one.
      # Unsigned on purpose: the signature is applied on your machine, with
      # your Apple ID, by the sideloading tool. The entitlements are stripped
      # too — a free Apple ID cannot grant App Groups, and leaving them in
      # makes the re-signing fail rather than degrade.
      - name: Archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Daybook.xcodeproj \
            -scheme Daybook \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Daybook.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify

      # An .ipa is a zip with the .app inside a folder called Payload. There is
      # no more to it than that, and xcodebuild's exporter refuses to help
      # without a signing identity.
      - name: Wrap it as an .ipa
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APP="build/Daybook.xcarchive/Products/Applications/Daybook.app"
          test -d "$APP" || { echo "No .app in the archive:"; find build/Daybook.xcarchive -maxdepth 4; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry Daybook.ipa Payload
          echo "Built $(du -h Daybook.ipa | cut -f1) — contents:"
          unzip -l Daybook.ipa | grep -E "\.app/|\.appex/" | head -5

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: Daybook-unsigned-ipa
          path: build/Daybook.ipa
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # wrangler reads secret NAMES from .dev.vars when generating Env. The
      # example file holds the names with placeholder values, so CI generates
      # the same shape a developer does.
      - run: cp .dev.vars.example .dev.vars
      # wrangler generates the runtime types, so they have to exist before tsc.
      - run: npx wrangler types
      - run: npx tsc --noEmit
      - run: npm test
